name: Build & release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --clean --noconfirm --onefile --windowed --name SMDATA-Fixer smdata_fixer_gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: SMDATA-Fixer-windows
          path: dist/SMDATA-Fixer.exe

  build-linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --clean --noconfirm --onefile --windowed --name SMDATA-Fixer smdata_fixer_gui.py
      - run: mv dist/SMDATA-Fixer dist/SMDATA-Fixer-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: SMDATA-Fixer-linux
          path: dist/SMDATA-Fixer-linux-x86_64

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/SMDATA-Fixer.exe
            artifacts/SMDATA-Fixer-linux-x86_64
